{% extends "base.html" %}

{% block title %}OpenShelf · Login{% endblock %}

{% block content %}
<section class="auth-page">
<div class="auth-panel">
    <p class="eyebrow">Account</p>
    <h1>Log in</h1>
    <p class="lead-text">Use your username or email and password.</p>

    <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
            <label class="form-label" for="identifier">Username or email</label>
            <input class="form-control" id="identifier" name="identifier" value="{{ identifier }}" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-accent" type="submit">Log in</button>
    </form>
    <p class="auth-switch">Need an account? <a href="{{ url_for('register') }}">Register</a></p>
</section>
</div>
{% endblock %}
